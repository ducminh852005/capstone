<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1d242d;
    --line: #2b3440;
    --text: #e7ebf0;
    --muted: #8d99a8;
    --accent: #38bdf8;
    --good: #34d399;
    --bad: #f87171;
    --warn: #fbbf24;
    --hit: #fb923c;
    --radius: 8px;
    --gutter: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px var(--gutter); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .brand strong { font-size: 15px; letter-spacing: .02em; }
  .brand span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 2px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--warn); font-size: 12px; }
  .badge.bad { color: var(--bad); border-color: var(--bad); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--gutter); padding: var(--gutter); align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .stage { position: relative; width: 100%; background: #000; border-radius: var(--radius); overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas { touch-action: none; }
  .stage.arrow-tool canvas { cursor: crosshair; }
  .stage-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: rgba(0, 0, 0, .75); color: var(--bad); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .btn { padding: 5px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 600; }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  select.btn { padding-right: 6px; }
  .readout { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

  .scrub { position: relative; height: 34px; margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; touch-action: none; }
  .scrub .pre { position: absolute; top: 0; bottom: 0; left: 0; background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .10) 0 4px, transparent 4px 8px); }
  .scrub .played { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(56, 189, 248, .22); }
  .scrub .head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
  .scrub .tick { position: absolute; top: 6px; bottom: 6px; width: 3px; margin-left: -1px; border-radius: 2px; }
  .tick.hit { background: var(--hit); }
  .tick.far { background: #94a3b8; }
  .tick.smash { background: #ef4444; top: 2px; bottom: 2px; width: 4px; }
  .band { position: absolute; top: 0; height: 5px; border-radius: 2px; opacity: .8; }
  .band.near { background: var(--good); }
  .band.far { background: #a78bfa; }
  .band.none { background: var(--muted); }
  .tick.in { background: var(--good); top: 12px; bottom: 2px; }
  .tick.out { background: var(--bad); top: 12px; bottom: 2px; }

  .swatches { display: inline-flex; gap: 6px; align-items: center; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .swatch.on { border-color: #fff; }
  .layers { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
  .layers label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

  .panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--line); margin: -4px -4px 10px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 7px; color: var(--muted); white-space: nowrap; font-size: 13px; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat small { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); font-weight: 400; }
  th { color: var(--muted); font-size: 12px; }
  .list { display: flex; flex-direction: column; max-height: 360px; overflow: auto; margin: 0 -4px; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
  .row:hover { background: var(--panel-2); }
  .row.dim { color: var(--muted); }
  .row .when { color: var(--muted); min-width: 74px; font-variant-numeric: tabular-nums; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
  .row .del { margin-left: auto; }
  .warn { color: var(--warn); font-size: 13px; margin: 0 0 6px; }
  .empty { color: var(--muted); margin: 4px 0; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .zone { border-radius: 6px; padding: 6px 8px; background: rgba(56, 189, 248, var(--a, 0)); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .zone span { display: block; color: var(--muted); font-size: 12px; }
  .levels { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 4px; background: var(--panel-2); }
  .levels i { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 12px; }
  .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .lrow { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .lrow .ctl { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; align-items: center; color: var(--muted); font-size: 13px; }
  .lrow .ctl label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .lrow.done { background: rgba(52, 211, 153, .06); }
  select.mini { padding: 2px 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; font-size: 13px; }
  #minimap { width: 100%; height: auto; display: block; border-radius: 6px; background: #0b3d1f; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>CầuLôngStats</strong><span id="clipName"></span></div>
  <div class="badges">
    <span id="badgePre" class="badge hidden">Khởi động: chưa tính vào số liệu</span>
    <span id="badgeSelftest" class="badge bad hidden" title="Phép chiếu trong trang khác với Python; số đo mét không đáng tin">Đo lường lệch</span>
  </div>
</header>

<main class="layout">
  <section>
    <div class="stage" id="stage">
      <video id="video" src="__VIDEO_SRC__" muted playsinline preload="auto"></video>
      <canvas id="overlay"></canvas>
      <div class="stage-msg hidden" id="stageMsg"></div>
    </div>

    <div class="scrub" id="scrub" role="slider" aria-label="Vị trí trong clip" tabindex="0">
      <div class="pre" id="scrubPre"></div>
      <div class="played" id="scrubPlayed"></div>
      <div id="bands"></div>
      <div id="ticks"></div>
      <div class="head" id="scrubHead"></div>
    </div>

    <div class="bar">
      <button class="btn" id="bBack10" title="Lùi 10 frame (Shift + ←)">-10</button>
      <button class="btn" id="bBack1" title="Lùi 1 frame (←)">-1</button>
      <button class="btn" id="bPlay" title="Phát / dừng (Space)">Phát</button>
      <button class="btn" id="bFwd1" title="Tiến 1 frame (→)">+1</button>
      <button class="btn" id="bFwd10" title="Tiến 10 frame (Shift + →)">+10</button>
      <select class="btn" id="speed" aria-label="Tốc độ phát">
        <option value="0.25">0,25x</option>
        <option value="0.5">0,5x</option>
        <option value="1" selected>1x</option>
      </select>
      <div class="readout" id="readout"></div>
    </div>

    <div class="bar">
      <button class="btn on" id="toolSelect" title="Chọn người chơi (Esc)">Chọn</button>
      <button class="btn" id="toolFloor" title="Mũi tên trên mặt sân, đo bằng mét (A)">Mũi tên mặt sân</button>
      <button class="btn" id="toolFree" title="Mũi tên tự do, đo bằng pixel">Mũi tên tự do</button>
      <span class="swatches" id="swatches" aria-label="Màu mũi tên"></span>
      <select class="btn" id="duration" aria-label="Thời gian hiển thị mũi tên">
        <option value="0">Chỉ khung này</option>
        <option value="0.5">0,5 giây</option>
        <option value="1" selected>1 giây</option>
        <option value="2">2 giây</option>
        <option value="end">Đến hết clip</option>
      </select>
      <button class="btn" id="bUndo" title="Hoàn tác (Ctrl + Z)">Hoàn tác</button>
    </div>
    <p class="hint" id="toolHint">Mũi tên mặt sân: hai đầu mút phải nằm trên sàn. Bấm gần chân người chơi để gắn gốc mũi tên vào chân.</p>

    <div class="bar layers">
      <label><input type="checkbox" data-layer="skeleton" checked> Khung xương</label>
      <label><input type="checkbox" data-layer="trail" checked> Quỹ đạo cầu</label>
      <label><input type="checkbox" data-layer="events" checked> Sự kiện</label>
      <label><input type="checkbox" data-layer="boxes" checked> Khung người chơi</label>
      <label><input type="checkbox" data-layer="court"> Đường sân (kiểm tra hiệu chuẩn)</label>
    </div>
  </section>

  <aside class="panel">
    <div class="card">
      <h2>Người chơi phân tích</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab on" role="tab" data-tab="overview">Tổng quan</button>
        <button class="tab" role="tab" data-tab="events">Sự kiện</button>
        <button class="tab" role="tab" data-tab="shots">Cú đánh</button>
        <button class="tab" role="tab" data-tab="labels">Nhãn</button>
        <button class="tab" role="tab" data-tab="movement">Di chuyển</button>
        <button class="tab" role="tab" data-tab="rallies">Rally</button>
        <button class="tab" role="tab" data-tab="arrows">Mũi tên</button>
      </div>
      <div id="tab-overview"></div>
      <div id="tab-events" class="hidden"></div>
      <div id="tab-shots" class="hidden"></div>
      <div id="tab-labels" class="hidden"></div>
      <div id="tab-movement" class="hidden"></div>
      <div id="tab-rallies" class="hidden"></div>
      <div id="tab-arrows" class="hidden"></div>
    </div>

    <div class="card">
      <h2>Sân (nhìn từ trên xuống)</h2>
      <canvas id="minimap" width="440" height="900"></canvas>
    </div>
  </aside>
</main>

<script id="analysis-data" type="application/json">__ANALYSIS_JSON__</script>
<script>
(() => {
'use strict';

const A = JSON.parse(document.getElementById('analysis-data').textContent);
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
const mini = $('minimap'), mctx = mini.getContext('2d');
const FPS = A.video.fps, N = A.video.n_frames, VW = A.video.width, VH = A.video.height;
const PRE = A.source.analysis_start_frame;
const NET_X = A.court.net_x_m, COURT_L = A.court.length_m, COURT_W = A.court.width_m;
const LB = A.labels;
const TAU = Math.PI * 2;
const HIT_RING_FRAMES = 40, HIT_LABEL_FRAMES = 25;       // a hit marker fades over 40 frames; its label is shown for the first 25
const LANDING_HOLD_FRAMES = 90, LANDING_FADE_FRAMES = 60;  // a landing marker is solid for 90 frames, then fades over 60
const SELECTED_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#38bdf8';
const SHUTTLE_COVERAGE = (() => {                   // frames of the analysed stretch with a shuttle position / a detection
  let withShuttle = 0, detected = 0;
  for (let i = PRE; i < N; i++) { if (A.shuttle.px[i]) withShuttle++; if (A.shuttle.kind[i] === 'd') detected++; }
  return { withShuttle, detected, span: Math.max(N - PRE, 1) };
})();

/* MATH-BEGIN: pure functions, no DOM (tested against Python by tests/test_clip_report.py) */
function wOf(M, x, y) { return M[2][0] * x + M[2][1] * y + M[2][2]; }

// Homography projector; null when the point is on the wrong side of the horizon (w of another sign
// than at the reference point) or numerically degenerate.
function makeProjector(M, refX, refY) {
  const refSign = Math.sign(wOf(M, refX, refY)) || 1;
  return (x, y) => {
    const w = wOf(M, x, y);
    if (!(w * refSign > 1e-9)) return null;
    return [(M[0][0] * x + M[0][1] * y + M[0][2]) / w, (M[1][0] * x + M[1][1] * y + M[1][2]) / w];
  };
}

function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

// Frame shown at video time t (s): frames are displayed from k/fps to (k+1)/fps.
function frameAtTime(t, fps, n) { return clamp(Math.floor(t * fps + 1e-3), 0, n - 1); }
function timeOfFrame(f, fps) { return (f + 0.5) / fps; }

// Last frame an arrow is visible on: `seconds` after f0, "end" = through the end of the clip.
function lastVisibleFrame(f0, seconds, fps, n) {
  if (seconds === 'end') return n - 1;
  return clamp(f0 + Math.round(Number(seconds) * fps), f0, n - 1);
}

// Floor measurement of an arrow between two court points (m): length, along/across parts and
// the court length covered by one image pixel at the worse end (cm), via `cmPerPx(worldPt)`.
function measureFloor(a, b, netX, cmPerPx) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const ca = cmPerPx(a), cb = cmPerPx(b);
  return { len: Math.hypot(dx, dy), dx, dy, far: Math.max(a[0], b[0]) > netX,
           cm: (ca === null || cb === null) ? null : Math.max(ca, cb) };
}

// Label file for scripts/merge_labels.py from the labels the user reviewed. Frames become absolute
// frames of the source video. Only reviewed items are written (an unreviewed automatic result is not
// ground truth); `ranges` is written only when the whole stretch was reviewed, so that a hit nobody
// labelled can be counted as a false positive.
//   ctx: {video, fps, startFrame, preFrames, nFrames, hits, shotType: {hitIndex: type}, landings}
//   st:  {hits: {index: {reviewed, isHit?, type?, hitter?}}, landings: {index: {reviewed, call?}},
//         added: [{frame, type, hitter}], rangeReviewed}
function buildLabelExport(ctx, st) {
  const abs = f => ctx.startFrame + f;
  const out = { video: ctx.video, fps: ctx.fps, ranges: [], hits: [], smashes: [], landings: [], shots: [] };
  const put = (frame, type, hitter, playerId, source, autoType) => {
    out.hits.push({ frame });
    if (type === 'smash') out.smashes.push({ frame });
    out.shots.push({ frame, type, hitter, player_id: playerId, source, auto_type: autoType });
  };
  for (const h of ctx.hits) {
    const o = st.hits[h.index];
    if (!o || !o.reviewed) continue;
    const isHit = o.isHit !== undefined ? o.isHit : h.valid;
    if (!isHit) continue;
    const auto = ctx.shotType[h.index] || 'unknown';
    const type = o.type || auto, hitter = o.hitter || h.hitter;
    const changed = type !== auto || hitter !== h.hitter || !h.valid;
    put(abs(h.contact_frame_idx), type, hitter, hitter === 'near' ? h.player_id : null, changed ? 'manual' : 'auto', auto);
  }
  for (const a of st.added) put(abs(a.frame), a.type, a.hitter, null, 'manual', null);
  ctx.landings.forEach((c, i) => {
    const o = st.landings[i];
    if (!o || !o.reviewed) return;
    const call = o.call || c.result;
    if (call !== 'none') out.landings.push({ frame: abs(c.frame_idx), call });
  });
  for (const k of ['hits', 'smashes', 'landings', 'shots']) out[k].sort((a, b) => a.frame - b.frame);
  if (st.rangeReviewed) out.ranges = [[abs(ctx.preFrames), abs(ctx.nFrames - 1)]];
  return out;
}
/* MATH-END */

const toImg = makeProjector(A.court.H, A.court.selftest[4].world_m[0], A.court.selftest[4].world_m[1]);
const toWorld = makeProjector(A.court.H_inv, A.court.selftest[4].img_px[0], A.court.selftest[4].img_px[1]);

// Court length (cm) covered by one image pixel at court point w: the worse of the two image axes.
function cmPerPx(w) {
  const p = toImg(w[0], w[1]);
  if (!p) return null;
  const a = toWorld(p[0] + 1, p[1]), b = toWorld(p[0], p[1] + 1);
  if (!a || !b) return null;
  return Math.max(Math.hypot(a[0] - w[0], a[1] - w[1]), Math.hypot(b[0] - w[0], b[1] - w[1])) * 100;
}

// ---- state ------------------------------------------------------------------------------------
let frame = 0, playing = false, selected = A.default_player;
let tool = 'select';                                  // 'select' | 'floor' | 'free'
let color = '#fbbf24', draft = null, nextId = 1, selectedArrow = null;
let arrows = [];                                      // {id, mode, a, b, f0, f1, color}
const history = [];
const layers = { skeleton: true, trail: true, events: true, boxes: true, court: false };
const COLORS = ['#fbbf24', '#f87171', '#34d399', '#38bdf8', '#e879f9', '#ffffff'];
const STORE_KEY = `telestrator:${A.source.video}:${A.source.start_frame}:${N}`;

const num = (v, d = 1) => v.toFixed(d).replace('.', ',');
const shotByHit = new Map(A.events.shots.map(x => [x.hit_index, x]));
const shotType = h => { const x = shotByHit.get(h.index); return x ? x.type : 'unknown'; };
const isSmash = h => shotType(h) === 'smash';
const hitLabel = h => (h.hitter === 'near' ? 'P' + h.player_id : h.hitter === 'far' ? 'Đối thủ' : '?') + (shotType(h) !== 'unknown' ? ' · ' + LB.shot_type[shotType(h)] : '');
const winnerLabel = r => r.winner ? LB.winner[r.winner] + (r.winner_confidence < 0.5 ? ' (?)' : '') : 'chưa rõ';
const fmtTime = f => num(f / FPS, 2) + ' s';
const track = id => A.players.find(p => p.player_id === id) || null;

// ---- playback ---------------------------------------------------------------------------------
let screenScale = 1, renderQueued = false;
function updateScale() {                              // screen px -> video px; cached because reading the layout forces a reflow
  const r = canvas.getBoundingClientRect();
  screenScale = Math.max(VW / Math.max(r.width, 1), 1);
}
function scheduleRender() {                           // one draw per animation frame, however many things changed
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function seek(f) {
  frame = clamp(Math.round(f), 0, N - 1);
  video.currentTime = timeOfFrame(frame, FPS);
  scheduleRender();
}
function setPlaying(on) {
  playing = on;
  $('bPlay').textContent = on ? 'Dừng' : 'Phát';
  if (on) {
    if (frame >= N - 1) seek(0);
    video.play().catch(() => setPlaying(false));
    tickPlayback();
  } else {
    video.pause();
    frame = frameAtTime(video.currentTime, FPS, N);
    scheduleRender();
  }
}
function tickPlayback() {
  if ('requestVideoFrameCallback' in video) {
    video.requestVideoFrameCallback((now, meta) => {
      if (!playing) return;
      frame = clamp(Math.round(meta.mediaTime * FPS), 0, N - 1);
      render();
      tickPlayback();
    });
  } else {
    requestAnimationFrame(() => {
      if (!playing) return;
      frame = frameAtTime(video.currentTime, FPS, N);
      render();
      tickPlayback();
    });
  }
}
video.addEventListener('seeked', () => { if (!playing) { frame = frameAtTime(video.currentTime, FPS, N); scheduleRender(); } });
video.addEventListener('ended', () => setPlaying(false));
video.addEventListener('error', () => {
  const m = $('stageMsg');
  m.textContent = 'Không tải được clip. Hãy mở index.html ngay trong thư mục chứa clip.mp4 (data/clips/<tên clip>/).';
  m.classList.remove('hidden');
});
function step(d) { if (playing) setPlaying(false); seek(frame + d); }

$('bBack10').onclick = () => step(-10);
$('bBack1').onclick = () => step(-1);
$('bFwd1').onclick = () => step(1);
$('bFwd10').onclick = () => step(10);
$('bPlay').onclick = () => setPlaying(!playing);
$('speed').onchange = e => { video.playbackRate = Number(e.target.value); };

// ---- scrubber ---------------------------------------------------------------------------------
const scrub = $('scrub');
function pct(f) { return N > 1 ? (f / (N - 1)) * 100 : 0; }
function buildTicks() {
  $('scrubPre').style.width = pct(PRE) + '%';
  const box = $('ticks');
  box.textContent = '';

function drawCourt(S) {

const MINI = (() => {                                  // minimap geometry: x along the court is vertical, the near baseline at the bottom

function render() {

  drawPlayers(S);

// ---- labelling ---------------------------------------------------------------------------------
const LABEL_KEY = 'labels:' + STORE_KEY;
let labelState = { hits: {}, landings: {}, added: [], rangeReviewed: false };
const SHOT_ORDER = ['serve', 'smash', 'drop', 'clear', 'lift', 'net', 'drive', 'unknown'];
function persistLabels() { try { localStorage.setItem(LABEL_KEY, JSON.stringify(labelState)); } catch (e) { /* blocked storage: labels live until the page closes; export them */ } }
function restoreLabels() {
  try {
    const raw = JSON.parse(localStorage.getItem(LABEL_KEY));
    if (raw && raw.hits && raw.landings && Array.isArray(raw.added)) labelState = raw;
  } catch (e) { /* corrupt or blocked storage: start empty */ }
}
function labelCtx() {
  return { video: A.source.video, fps: FPS, startFrame: A.source.start_frame, preFrames: PRE, nFrames: N,
           hits: A.events.hits, shotType: Object.fromEntries([...shotByHit].map(([i, x]) => [i, x.type])), landings: A.events.landings };
}
function labelChange(fn) { fn(); persistLabels(); renderLabels(); }          // structural change: rebuild the tab
function labelPatch(fn, refresh) { fn(); persistLabels(); refresh(); }          // one control changed: update in place
function mkSelect(items, selected, onchange) {
  const s = document.createElement('select'); s.className = 'mini';
  for (const [value, text] of items) { const o = document.createElement('option'); o.value = value; o.textContent = text; o.selected = value === selected; s.appendChild(o); }
  s.onchange = () => onchange(s.value);
  return s;
}
function mkCheck(text, checked, onchange) {
  const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox'; c.checked = checked;
  c.onchange = () => onchange(c.checked); l.append(c, text); return l;
}
function seekRow(text, f) {
  const b = document.createElement('button'); b.className = 'row'; b.style.padding = '0'; b.textContent = text;
  b.onclick = () => { if (playing) setPlaying(false); seek(f); };
  return b;
}
const hitterItems = auto => [['', 'Giữ gợi ý: ' + LB.hitter[auto]], ['near', LB.hitter.near], ['far', LB.hitter.far], ['unknown', LB.hitter.unknown]];
const shotItems = auto => [['', 'Giữ gợi ý: ' + LB.shot_type[auto]], ...SHOT_ORDER.map(k => [k, LB.shot_type[k]])];
const reviewed = o => !!(o && o.reviewed);
let labelSummary = null;
function updateLabelSummary() {
  if (!labelSummary) return;
  const st = labelState;
  const done = A.events.hits.filter(h => reviewed(st.hits[h.index])).length;
  const doneL = A.events.landings.filter((c, i) => reviewed(st.landings[i])).length;
  labelSummary.textContent = `Đã duyệt ${done}/${A.events.hits.length} cú, ${doneL}/${A.events.landings.length} điểm rơi, thêm tay ${st.added.length} cú.`;
}
function labelRow(done) {
  const row = document.createElement('div'); row.className = 'lrow' + (done ? ' done' : '');
  const ctl = document.createElement('div'); ctl.className = 'ctl';
  return { row, ctl, refresh: isDone => { row.classList.toggle('done', isDone); updateLabelSummary(); } };
}
function renderLabelBar(box, st) {
  const bar = document.createElement('div'); bar.className = 'bar'; bar.style.marginTop = '0';
  const all = document.createElement('button'); all.className = 'btn'; all.textContent = 'Duyệt tất cả gợi ý';
  all.onclick = () => labelChange(() => {
    for (const h of A.events.hits) st.hits[h.index] = { ...(st.hits[h.index] || {}), reviewed: true };

  });
  const exp = document.createElement('button'); exp.className = 'btn on'; exp.textContent = 'Xuất nhãn';
  exp.onclick = () => {

function renderHitLabels(box, st) {
  box.appendChild(heading('Cú đánh', 12));
  const hits = [...A.events.hits].sort((a, b) => a.contact_frame_idx - b.contact_frame_idx);
  for (const h of hits) {
    const o = st.hits[h.index] || {};
    const { row, ctl, refresh } = labelRow(o.reviewed);
    const set = patch => labelPatch(() => { st.hits[h.index] = { ...(st.hits[h.index] || {}), ...patch }; }, () => refresh(reviewed(st.hits[h.index])));
    const label = h.valid ? hitLabel(h) : 'gợi ý: không phải cú đánh (' + LB.reject_reason[h.reject_reason] + ')';
    ctl.append(
      mkCheck('Là cú đánh', o.isHit !== undefined ? o.isHit : h.valid, v => set({ isHit: v })),
      mkSelect(shotItems(shotType(h)), o.type || '', v => set({ type: v || undefined })),
      mkSelect(hitterItems(h.hitter), o.hitter || '', v => set({ hitter: v || undefined })),
      mkCheck('Đã duyệt', !!o.reviewed, v => set({ reviewed: v })));
    row.append(seekRow(`${whenOf(h.contact_frame_idx)} · ${label}`, h.contact_frame_idx), ctl);

               mkSelect(hitterItems('near').slice(1), a.hitter, v => labelPatch(() => { a.hitter = v; }, () => {})), del);
    row.append(seekRow(`${whenOf(a.frame)} · cú thêm tay`, a.frame), ctl);
    box.appendChild(row);
  });
  if (!hits.length && !st.added.length) emptyNote(box, 'Chưa có cú đánh nào để duyệt. Dùng "Thêm cú đánh bị sót" để gán nhãn thủ công.');
}
function renderLandingLabels(box, st) {
  box.appendChild(heading('Điểm rơi', 12));

    ctl.append(mkSelect([['', 'Giữ gợi ý: ' + LB.call_result[c.result]], ['IN', 'Đúng: Trong'], ['OUT', 'Đúng: Ngoài'], ['none', 'Không phải điểm rơi']], o.call || '', v => set({ call: v || undefined })),

    row.append(seekRow(`${whenOf(c.frame_idx)} · gợi ý: ${LB.call_result[c.result]} · ${LB.call_half[c.half]}`, c.frame_idx), ctl);

function renderLabels() {
  const box = $('tab-labels'); box.textContent = '';
  emptyNote(box, 'Duyệt từng cú: sửa loại cú hoặc người đánh nếu gợi ý sai, bỏ chọn "Là cú đánh" nếu không phải cú đánh, rồi tích "Đã duyệt". Chỉ mục đã duyệt được xuất. Nhãn xuất ra dùng để chấm và chỉnh ngưỡng (scripts/merge_labels.py, scripts/eval_shots.py).');

  };
  const clr = document.createElement('button'); clr.className = 'btn danger'; clr.textContent = 'Xóa hết';
  clr.onclick = () => { if (arrows.length) mutate(() => { arrows = []; selectedArrow = null; }); };
  bar.append(exp, imp, clr, file);
  box.appendChild(bar);
  if (!arrows.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Chưa có mũi tên. Chọn "Mũi tên mặt sân" rồi kéo trên video.'; box.appendChild(p); return; }
  const list = document.createElement('div'); list.className = 'list';
  for (const a of arrows) {
    const row = document.createElement('div'); row.className = 'row'; row.dataset.arrow = a.id; row.style.cursor = 'pointer';
    if (a.id === selectedArrow) row.style.background = 'var(--panel-2)';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = a.color;
    const when = document.createElement('span'); when.className = 'when'; when.textContent = `${a.f0}-${a.f1}`;
    const txt = document.createElement('span'); txt.textContent = (a.mode === 'floor' ? 'Mặt sân · ' : 'Tự do · ') + arrowText(a);
    const del = document.createElement('button'); del.className = 'btn danger del'; del.dataset.del = '1'; del.textContent = 'Xóa';
    row.append(dot, when, txt, del);
    list.appendChild(row);
  }
  box.appendChild(list);
}
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    for (const id of ['overview', 'events', 'shots', 'labels', 'movement', 'rallies', 'arrows']) $('tab-' + id).classList.toggle('hidden', id !== t.dataset.tab);
  };
});

// ---- keyboard ---------------------------------------------------------------------------------
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (k === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
  else if (k === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 10 : 1); }
  else if (k === 'a' || k === 'A') setTool(tool === 'floor' ? 'select' : 'floor');
  else if (k === 'Escape') { draft = null; selectedArrow = null; setTool('select'); renderArrowList(); }
  else if (k === 'Delete' || k === 'Backspace') {
    const id = selectedArrow ?? (arrows.length ? arrows[arrows.length - 1].id : null);
    if (id !== null) removeArrow(id);
  } else if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); undo(); }
});

// ---- init -------------------------------------------------------------------------------------
function selftest() {
  // The page's own homography arithmetic must reproduce what Python computed for the same points.
  for (const t of A.court.selftest) {
    const w = toWorld(t.img_px[0], t.img_px[1]);
    if (!w || Math.hypot(w[0] - t.world_m[0], w[1] - t.world_m[1]) > 1e-3) { $('badgeSelftest').classList.remove('hidden'); return; }
  }
}
function init() {
  canvas.width = VW; canvas.height = VH;
  $('stage').style.aspectRatio = `${VW} / ${VH}`;
  $('clipName').textContent = `${A.source.video} · từ frame ${A.source.start_frame} · ${N} frame · ${num(FPS, 0)} fps`;
  selftest();
  buildTicks(); renderChips(); renderOverview(); renderEvents(); renderShots(); restoreLabels(); renderLabels(); renderMovement(); renderRallies(); restore(); renderArrowList();
  updateScale();
  new ResizeObserver(() => { updateScale(); scheduleRender(); }).observe(canvas);
  const m = /[#&]f=(\d+)/.exec(location.hash);
  const first = () => seek(m ? Number(m[1]) : PRE);               // #f=<clip frame> opens the page at that frame
  if (video.readyState >= 1) first(); else video.addEventListener('loadedmetadata', first, { once: true });
  paintMiniBase();
  render();
}
init();
})();
</script>
